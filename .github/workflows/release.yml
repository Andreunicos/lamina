name: Publicar versão

# Todo push na main vira uma versão nova (1.0.<número da execução>).
# O app instalado encontra essa release e se atualiza sozinho.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Definir número da versão
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Versão: $VERSION"

      - name: Gerar instalador
        run: npx electron-builder --win --publish never

      # Publica com o gh numa chamada só (o publish do electron-builder envia os
      # arquivos em paralelo e às vezes cria a release duas vezes).
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          git log -1 --pretty=%B > notes.txt
          gh release create "v$VERSION" \
            "dist/Lamina-Setup-$VERSION.exe" \
            "dist/Lamina-Setup-$VERSION.exe.blockmap" \
            dist/latest.yml \
            --title "Lâmina $VERSION" \
            --notes-file notes.txt \
            --target "$GITHUB_SHA" \
            --latest
